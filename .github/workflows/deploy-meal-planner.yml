name: Deploy Meal Planner to GitHub Pages

on:
  push:
    branches:
      - claude/pwa-meal-planner-shopping-fas6np
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Harmless once the Pages site already exists; kept so this still
          # self-heals if the Pages site is ever removed.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: meal-planner
      - id: deployment
        uses: actions/deploy-pages@v4
