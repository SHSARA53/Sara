name: Deploy Meal Planner to GitHub Pages

on:
  push:
    branches:
      - claude/pwa-meal-planner-shopping-fas6np
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # This repo has no Pages site yet, so let this action create one
          # (source: GitHub Actions) instead of failing with "Get Pages
          # site failed / Not Found" - that's what the plain default did.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: meal-planner
      - id: deployment
        uses: actions/deploy-pages@v4
